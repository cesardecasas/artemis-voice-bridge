[project]
name = "artemis-voice-bridge"
version = "1.4.0"
description = "Local, self-contained voice interface for the Artemis assistant"
requires-python = ">=3.12"

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true

# Third-party packages that ship without type information.
[[tool.mypy.overrides]]
module = ["av.*", "openvino_genai.*", "kokoro_onnx.*", "soundfile.*", "onnxruntime.*"]
ignore_missing_imports = true
