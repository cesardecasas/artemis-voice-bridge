<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Artemis</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#04070d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Artemis">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preload" href="fonts/sora-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/artemis.css">
</head>
<body class="booting">
<div class="hud">

    <header class="topbar">
        <div class="brand">
            <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
                <defs><mask id="brandmoon"><circle cx="20" cy="20" r="11" fill="#fff"/><circle cx="25" cy="17" r="9.5" fill="#000"/></mask></defs>
                <circle cx="20" cy="20" r="11" fill="#d9ecff" mask="url(#brandmoon)"/>
                <ellipse cx="20" cy="20" rx="17" ry="6" fill="none" stroke="#6ef2c4" stroke-width="1.5" transform="rotate(-24 20 20)"/>
            </svg>
            <div style="display: flex; flex-direction: column">
                <span class="brand-name">ARTEMIS</span>
                <span class="brand-session" id="session-label">connecting…</span>
            </div>
        </div>
        <button class="iconbtn" id="mute-btn" type="button" aria-label="Mute Artemis's voice" aria-pressed="false">
            <svg class="icon-unmuted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <svg class="icon-muted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>
        </button>
    </header>

    <section class="statusbar panel" aria-label="System status">
        <div class="svc" id="svc-stt" data-status="unknown"><span class="dot"></span><span class="label">Hearing</span><span class="svc-value">…</span></div>
        <div class="svc" id="svc-tts" data-status="unknown"><span class="dot"></span><span class="label">Voice</span><span class="svc-value">…</span></div>
        <div class="svc svc-agent" id="svc-agent" data-status="unknown"><span class="dot"></span><span class="label">Agent</span><span class="svc-value">…</span></div>
        <div class="svc" id="svc-link" data-status="loading"><span class="dot"></span><span class="label">Link</span><span class="svc-value">connecting</span></div>
        <div class="metrics" id="metrics" aria-live="off"></div>
    </section>

    <form id="auth-form" class="auth panel" hidden autocomplete="off">
        <label for="auth-token">Access token</label>
        <div class="auth-row">
            <input id="auth-token" type="password" placeholder="Paste your Artemis token" required>
            <button class="btn btn-ready-solid" type="submit">Connect</button>
        </div>
        <small>Find it in <code>.env</code> as <code>ARTEMIS_ACCESS_TOKEN</code>, or open <code>/#token=…</code> once on this device.</small>
    </form>

    <main class="stage">
        <section class="side panel conversation" aria-label="Conversation">
            <div class="side-head"><h2 class="label">Conversation</h2><span class="side-meta" id="turn-count"></span></div>
            <div class="feed" id="display" data-empty="Tap the core, hold Space, or type below to talk to Artemis." aria-live="polite"></div>
        </section>

        <section class="core-col" aria-label="Artemis core">
            <div class="core is-offline" id="core">
                <button class="orb-btn" id="record-btn" type="button" aria-label="Start recording" aria-pressed="false">
                    <svg class="orb" viewBox="0 0 400 400" aria-hidden="true">
                        <defs>
                            <radialGradient id="halo"><stop offset="0" class="halo-c" stop-opacity=".22"/><stop offset=".65" stop-color="#a9b4ff" stop-opacity=".10"/><stop offset="1" stop-color="#6ef2c4" stop-opacity="0"/></radialGradient>
                            <radialGradient id="moonfill" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d9ecff"/><stop offset="1" stop-color="#6fc3f5"/></radialGradient>
                            <mask id="crescent"><circle cx="200" cy="200" r="74" fill="#fff"/><circle cx="234" cy="180" r="64" fill="#000"/></mask>
                        </defs>
                        <circle cx="200" cy="200" r="196" fill="url(#halo)"/>
                        <circle class="ring-outer" cx="200" cy="200" r="184" fill="none" stroke-width="1"/>
                        <circle class="ticks" cx="200" cy="200" r="170" fill="none" stroke-width="7" stroke-dasharray="1.5 8.5"/>
                        <circle class="arcs-a" cx="200" cy="200" r="150" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="130 34 22 58 76 92 18 48"/>
                        <circle class="arcs-b" cx="200" cy="200" r="136" fill="none" stroke-width="1.5" stroke-dasharray="44 22 150 64"/>
                        <circle class="ripple r1" cx="200" cy="200" r="92" fill="none" stroke-width="2"/>
                        <circle class="ripple r2" cx="200" cy="200" r="92" fill="none" stroke-width="2"/>
                        <circle class="ripple r3" cx="200" cy="200" r="92" fill="none" stroke-width="2"/>
                        <circle class="level" cx="200" cy="200" r="96" fill="none" stroke-width="12"/>
                        <g class="moon-level"><g class="moon"><circle cx="200" cy="200" r="74" fill="url(#moonfill)" mask="url(#crescent)"/></g></g>
                        <g transform="rotate(-24 200 200)">
                            <ellipse class="orbit-path" cx="200" cy="200" rx="128" ry="44" fill="none" stroke-width="2"/>
                            <circle class="sat" r="6"><animateMotion dur="9s" repeatCount="indefinite" path="M72,200 a128,44 0 1,0 256,0 a128,44 0 1,0 -256,0"/></circle>
                        </g>
                    </svg>
                </button>
                <div class="wave" id="visualizer" aria-hidden="true"></div>
                <div class="core-text">
                    <div class="state-title" id="state-title">Offline</div>
                    <div class="state-hint" id="status" role="status">Connecting…</div>
                </div>
            </div>
        </section>

        <section class="side panel activity" aria-label="Activity">
            <div class="side-head"><h2 class="label">Activity</h2><span class="side-meta" id="agent-label"></span></div>
            <div class="feed" id="activity" data-empty="Tool use and approval requests from the agent appear here."></div>
        </section>
    </main>

    <form class="composer panel" id="composer" autocomplete="off">
        <label for="text-input" class="visually-hidden">Message Artemis</label>
        <input id="text-input" type="text" placeholder="Type to Artemis…" enterkeyhint="send">
        <button class="btn btn-ready" type="submit">Send</button>
        <div class="keys" aria-hidden="true"><span class="kbd">Space</span> hold to talk <span class="kbd">Esc</span> stop</div>
    </form>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
